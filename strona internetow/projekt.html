<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep Internetowy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .product {
            background: white;
            width: 250px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        .product img {
            width: 100%;
            border-radius: 10px;
        }

        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #219150;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        #koszyk {
            text-align: center;
            font-size: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>TechShop</h1>
    <p>Twój sklep z elektroniką</p>
</header>

<div id="koszyk">
    Koszyk: <span id="liczba">0</span> produktów
</div>

<div class="container">

    <div class="product">
        <img src="https://via.placeholder.com/250x150" alt="Laptop">
        <h2>Laptop</h2>
        <p>Cena: 2999 zł</p>
        <button onclick="dodaj()">Dodaj do koszyka</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/250x150" alt="Telefon">
        <h2>Smartfon</h2>
        <p>Cena: 1499 zł</p>
        <button onclick="dodaj()">Dodaj do koszyka</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/250x150" alt="Słuchawki">
        <h2>Słuchawki</h2>
        <p>Cena: 299 zł</p>
        <button onclick="dodaj()">Dodaj do koszyka</button>
    </div>

</div>

<footer>
    © 2026 TechShop - Projekt szkolny
</footer>

<script>
    let licznik = 0;

    function dodaj() {
        licznik++;
        document.getElementById("liczba").innerText = licznik;
    }
</script>

</body>
</html>
