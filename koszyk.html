<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koszyk - TechShop</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.item{
    background:white;
    padding:15px;
    margin:10px auto;
    max-width:500px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    display:flex;
    justify-content:space-between;
}

#suma{
    text-align:center;
    font-size:24px;
    margin-top:20px;
    font-weight:bold;
}

.buttons{
    text-align:center;
    margin-top:20px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.order{
    background:#e67e22;
    color:white;
}

.back{
    background:#3498db;
    color:white;
}
</style>
</head>

<body>

<h1>🛒 Twój koszyk</h1>

<div id="lista"></div>

<div id="suma">Razem: 0 zł</div>

<div class="buttons">
    <button class="order" onclick="zamowTeraz()">Zamów teraz</button>
    <button class="back" onclick="window.location.href='index.html'">Wróć do sklepu</button>
</div>

<script>

let koszyk = JSON.parse(localStorage.getItem("koszyk")) || [];

let lista = document.getElementById("lista");
let suma = 0;

// wyświetlanie produktów
koszyk.forEach(produkt => {
    lista.innerHTML += `
        <div class="item">
            <span>${produkt.nazwa}</span>
            <span>${produkt.cena} zł</span>
        </div>
    `;
    suma += produkt.cena;
});

// suma
document.getElementById("suma").innerText = "Razem: " + suma + " zł";

// zamówienie
function zamowTeraz() {
    if (koszyk.length === 0) {
        alert("Koszyk jest pusty!");
        return;
    }

    alert("Zamówienie zostało złożone!");

    localStorage.removeItem("koszyk");

    window.location.href = "index.html";
}

</script>

</body>
</html>
